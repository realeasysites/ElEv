<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Leads · Elevated Events Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <header class="topbar">
    <div class="tb-brand"><img src="/img/logo-mark.png" alt="" width="44"> <span>Elevated Events</span> <em>Leads</em></div>
    <div class="tb-actions">
      <a href="/" target="_blank" rel="noopener">View site</a>
      <a href="/api/admin/leads.csv">Export CSV</a>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="dash">
    <section class="stats" id="stats" aria-label="Lead counts"></section>

    <div class="dash-grid">
      <section class="panel leads-panel" aria-labelledby="leadsTitle">
        <div class="panel-head">
          <h2 id="leadsTitle">Quote requests</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Search name, phone, town…" aria-label="Search leads">
            <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
          </div>
        </div>
        <div id="leadList" class="lead-list"><p class="empty">Loading…</p></div>
      </section>

      <aside class="panel upcoming" aria-labelledby="upTitle">
        <h2 id="upTitle">Upcoming booked events</h2>
        <p class="hint">Status set to <b>Booked</b>, sorted by event date. Days with more than one booking are flagged, so check your inventory.</p>
        <ul id="upcomingList"></ul>
      </aside>
    </div>
  </main>

  <script src="/admin/assets/admin.js"></script>
</body>
</html>
